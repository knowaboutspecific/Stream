<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matinee: free movies you can watch legally</title>
<style>
:root{color-scheme:dark;--bg:#0f2a30;--panel:#173a42;--line:#2c5a64;--text:#f4efe3;--muted:#9fbcc0;--amber:#ffb627;--ink:#1a1204;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
header{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:30px 5vw 18px}
.sign{padding:8px 22px;font:italic 700 1.7rem/1 var(--serif);color:var(--ink);background:var(--amber);border-radius:6px;outline:4px dotted var(--amber);outline-offset:6px;margin:6px}
#q{flex:1;min-width:200px;max-width:380px;margin-left:auto;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font:inherit}
main{padding:8px 5vw 56px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{padding:6px 15px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.film{display:block;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.poster{display:block;aspect-ratio:2/3;margin-bottom:10px;border-radius:4px;background:var(--art) center/cover}
.film:hover .poster{outline:3px solid var(--amber);outline-offset:2px}
.film b{display:block;font:700 1.05rem/1.25 var(--serif)}
.film small,.sub{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted)}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,16,19,.92)}
#modal.open{display:flex}
.box{width:min(960px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:8px}
.screen{position:relative;aspect-ratio:16/9;background:#000}
.screen video,.screen iframe{display:block;width:100%;height:100%;border:0}
.fail{position:absolute;inset:0;display:grid;place-content:center;gap:8px;padding:20px;text-align:center;background:#000}
.fail a{color:var(--amber)}
.info{padding:18px 22px 22px;max-width:70ch}
